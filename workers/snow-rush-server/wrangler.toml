# Companion Cloudflare Worker + SQLite Durable Object for Snow Rush Multiplayer
# Isolated from the root Child Vibes Cloudflare Pages config (../../wrangler.toml).
# DO NOT add secrets or service account keys to this file.

name = "child-vibes-snow-rush-server"
main = "src/index.ts"
compatibility_date = "2025-02-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "SNOW_RUSH_ROOM", class_name = "SnowRushRoomDO" }
]

# Cloudflare Free Tier requires SQLite-backed Durable Objects (`new_sqlite_classes`)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnowRushRoomDO"]

[vars]
FIREBASE_PROJECT_ID = "gen-lang-client-0335200904"
FIRESTORE_DATABASE_ID = "ai-studio-47dffdd9-9dac-40e5-b320-95d71826db89"
SNAPSHOT_BROADCAST_HZ = "10"
# Verified Origin allowlist separating Production (`https://child-vibes3050.pages.dev`),
# Cloudflare Pages Preview subdomains (`https://*.child-vibes3050.pages.dev`), and AI Studio preview URLs.
ALLOWED_ORIGINS = "https://child-vibes3050.pages.dev,https://*.child-vibes3050.pages.dev,https://ais-dev-qw4gg4jal2u3tup36rro7r-1033756722286.asia-southeast1.run.app,https://ais-pre-qw4gg4jal2u3tup36rro7r-1033756722286.asia-southeast1.run.app"
